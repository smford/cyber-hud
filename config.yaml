    hardware.ino: |-
        // EEH ESP32 RFID Safety Sentry
        #include <SPI.h>
        #include <MFRC522.h>

        #define SS_PIN    5
        #define RST_PIN   22
        #define RELAY_PIN 25

        MFRC522 rfid(SS_PIN, RST_PIN);

        void setup() {
          Serial.begin(115200);
          SPI.begin();
          rfid.PCD_Init();
          pinMode(RELAY_PIN, OUTPUT);
          digitalWrite(RELAY_PIN, HIGH); // Lockout active
          Serial.println("[MAINFRAME] Safety interlock armed.");
        }

        void loop() {
          if (!rfid.PICC_IsNewCardPresent() || !rfid.PICC_ReadCardSerial()) return;
          Serial.println("[AUTH] Clearance granted. Engaging power relay.");
          digitalWrite(RELAY_PIN, LOW);
          delay(10000); // 10s tool duty cycle
          digitalWrite(RELAY_PIN, HIGH);
        }
    notes.md: |-
