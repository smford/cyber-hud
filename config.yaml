build_logs:
    - id: log-042
      category: Hardware
      title: EEH ESP32 RFID Tool Sentry
      date: "2026-04-12"
      status: DEPLOYED_ACTIVE
      summary: Industrial RFID safety interlock system preventing unauthorized activation of 3kW workshop machinery and high-draw fabrication tools.
      bom:
        - item: ESP32 DevKit V1 (38-pin)
          qty: "1"
          role: Main Microcontroller
        - item: RC522 13.56MHz RFID Module
          qty: "1"
          role: User Badge Scanner
        - item: Optocoupler 5V Relay Block
          qty: "1"
          role: High-Voltage Coil Isolation
        - item: 128x64 I2C OLED Display
          qty: "1"
          role: Telemetry & Operator Prompt
      pinout:
        - gpio: GPIO 21
          device: I2C SDA
          note: OLED Screen Data line
        - gpio: GPIO 22
          device: I2C SCL
          note: OLED Screen Clock line
        - gpio: GPIO 5
          device: SPI SS / CS
          note: RC522 RFID Chip Select
        - gpio: GPIO 18
          device: SPI SCK
          note: RC522 SPI Clock
        - gpio: GPIO 25
          device: Relay Trigger
          note: Active-Low Contactor Fire
      schematic: |-
        [ 230V AC Mains ] ---> [ 30A Contactor ] ---> [ Workshop Table Saw ]
                                     ^
                                     | (Galvanic Isolation)
        [ ESP32 GPIO 25 ] ---> [ PC817 Optocoupler ] ---> [ 5V Relay Coil ]
      notes: To prevent inductive back-EMF surges when 3kW induction motors spin down, the 5V relay coil is completely isolated with an optocoupler and flyback diode. User badges are verified locally via flash lookup tables.
